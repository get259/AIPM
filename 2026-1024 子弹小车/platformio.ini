; 使用现有 ESP-IDF 工程结构，不切换到 Arduino。
[platformio]
default_envs = esp32s3
src_dir = main

[env:esp32s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; 与工程现有 ESP32-S3 默认配置一致：16 MB Flash、QIO、OPI PSRAM。
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions/v2/16m.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.platformio"

; 仅构建现有面包板板型用于兼容性验证，不代表已确认实际接线。
; 使用工程原有的组件管理器下载 idf_component.yml 中的依赖。
extra_scripts =
    pre:scripts/platformio_build.py
    post:scripts/platformio_resources.py
