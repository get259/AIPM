[platformio]
default_envs = stm32_motion

[env:stm32_motion]
platform = ststm32@20.0.0
board = genericSTM32F103C8
board_build.f_cpu = 72000000L
board_build.ldscript = scripts/stm32f103c8.ld
extra_scripts = post:scripts/build.py
build_flags =
    -D USE_STDPERIPH_DRIVER
    -D STM32F10X_MD
    -I include
    -Wall
    -Wextra
; 串口下载参数沿用参考工程，端口通过上传命令显式指定。
upload_protocol = serial
upload_speed = 256000
upload_flags =
    -v
    -i
    -dtr,rts,dtr,,,:-rts,dtr
monitor_speed = 115200
