; 独立项目与缓存，避免测试切换平台时清理 ESP32 固件的构建目录。
[platformio]
src_dir = ../main
test_dir = ../test
build_dir = ../.pio/car-tests
libdeps_dir = ../.pio/car-test-libdeps

[env:car_tests]
platform = native@1.2.1
extra_scripts = pre:../scripts/platformio_native.py
test_framework = unity
test_filter = test_car
test_build_src = yes
build_src_filter =
    -<*>
    +<car/ActionJson.cpp>
    +<car/car_reply.cc>
    +<car/car_frame.cc>
build_flags =
    -std=c++11
    -I../main/car

[env:serial_tests]
extends = env:car_tests
test_filter = test_serial
test_build_src = no
build_flags =
    -std=c++11
    -I../main/serial_chat
